<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="Afyanine - maternal health monitoring">
  <title>Afyanine</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b5c53"/>
      <stop offset="1" stop-color="#17806f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="200" rx="18" fill="url(#bgGrad)"/>
  <!-- nine-month dots -->
  <g>
    <circle cx="560" cy="46" r="6" fill="#7fd8ca"/>
    <circle cx="595" cy="46" r="6" fill="#ff8a80"/>
    <circle cx="630" cy="46" r="6" fill="#7fd8ca"/>
    <circle cx="665" cy="46" r="6" fill="#ff8a80"/>
    <circle cx="700" cy="46" r="6" fill="#7fd8ca"/>
    <circle cx="735" cy="46" r="6" fill="#ff8a80"/>
    <circle cx="770" cy="46" r="6" fill="#7fd8ca"/>
    <circle cx="805" cy="46" r="6" fill="#ff8a80"/>
    <circle cx="840" cy="46" r="6" fill="#7fd8ca"/>
    <text x="700" y="26" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#bfeee6">9 months, one conversation</text>
  </g>
  <!-- heart motif -->
  <g transform="translate(790 40)">
    <path d="M50 90 C50 90 20 70 20 48 C20 34 30 26 40 26 C46 26 49.5 29 50 33 C50.5 29 54 26 60 26 C70 26 80 34 80 48 C80 70 50 90 50 90 Z"
          fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="3"/>
    <polyline points="28,64 44,64 51,44 60,78 66,64 74,64" fill="none" stroke="#ff8a80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- wordmark -->
  <text x="64" y="104" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff">Afyanine</text>
  <text x="66" y="142" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#bfeee6">Maternal health monitoring — planning phase</text>
  <text x="66" y="176" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8ed3c9">afya (health) + nine (months) · consent-first · offline-ready</text>
</svg>
